<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request Header Parser</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Georgia, "Times New Roman", serif;
        background: #f5f0e8;
        color: #1d2923;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 80% 10%, #e4c9a5 0, transparent 35%), #f5f0e8;
      }

      main {
        width: min(680px, calc(100% - 40px));
        padding: 48px 0;
      }

      .eyebrow {
        color: #b34d32;
        font: 700 0.8rem/1.2 Arial, sans-serif;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 560px;
        margin: 12px 0 20px;
        font-size: clamp(2.7rem, 8vw, 5.5rem);
        line-height: 0.95;
        font-weight: 400;
      }

      p {
        max-width: 520px;
        font-size: 1.15rem;
        line-height: 1.6;
      }

      code {
        padding: 3px 7px;
        background: #1d2923;
        color: #f5f0e8;
        font-size: 0.95em;
      }

      a {
        color: #b34d32;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">FreeCodeCamp API project</div>
      <h1>Know the request.</h1>
      <p>This microservice reads the headers sent by your browser and returns your IP address, preferred language, and software.</p>
      <p>Try the endpoint: <a href="/api/whoami"><code>/api/whoami</code></a></p>
    </main>
  </body>
</html>
